
{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Blog</title>

    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}?v=4">
</head>
<body>

    <header>
        <h1>Mi Blog</h1>

        
    <nav>
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'acerca' %}">Acerca de</a>
        <a href="{% url 'lista_posts' %}">Publicaciones</a>

        {% if user.is_authenticated %}

            <a href="{% url 'perfil' %}">Mi perfil</a>

            <a href="{% url 'crear_post' %}">Crear post</a>

            <form method="POST"
                  action="{% url 'logout' %}"
                  class="form-logout">
                {% csrf_token %}
                <button type="submit" class="boton-logout">
                    Cerrar sesión
                </button>
            </form>

        {% else %}

            <a href="{% url 'login' %}">Iniciar sesión</a>

            <a href="{% url 'registro' %}">Registrarse</a>

        {% endif %}
    </nav>

    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Blog desarrollado con Python y Django - Coderhouse</p>
    </footer>

</body>
</html>
